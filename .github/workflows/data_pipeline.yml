name: Pediatric Camp Data Pipeline

# Runs the ETL pipeline whenever new/changed CSV files are pushed, and lets
# you trigger it manually from the Actions tab.
on:
  push:
    paths:
      - "csv/**"
  workflow_dispatch: {}

# Avoid overlapping runs stacking up when several CSVs land close together.
concurrency:
  group: pediatric-camp-data-pipeline
  cancel-in-progress: false

# Needed to: commit generated files back to the repo, and publish to Pages.
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run-etl:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ETL pipeline
        run: python scripts/etl.py

      - name: Commit generated files
        env:
          # IMPORTANT: do not print secrets or credentials in logs.
          GIT_AUTHOR_NAME: "pediatric-camp-bot"
          GIT_AUTHOR_EMAIL: "actions@users.noreply.github.com"
        run: |
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"
          git add output/ excel/
          if git diff --cached --quiet; then
            echo "No generated-file changes to commit."
          else
            git commit -m "chore: auto-update pipeline outputs [skip ci]"
            git push
          fi

      # ---- Publish the dashboard to GitHub Pages ----------------------------
      # Bundles website/ together with the freshly-generated output/ and
      # images/ (script.js reads them via "../output/..." and "../images/...",
      # so the folder layout below must stay in sync with website/script.js).
      - name: Assemble Pages site
        run: |
          mkdir -p _site/website
          cp -r website/. _site/website/
          cp -r output _site/output
          cp -r images _site/images
          cat > _site/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta http-equiv="refresh" content="0; url=./website/">
              <title>Redirecting…</title>
            </head>
            <body>
              <p>Redirecting to the <a href="./website/">Pediatric Camp dashboard</a>…</p>
            </body>
          </html>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
